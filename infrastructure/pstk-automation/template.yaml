AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  FSx for ONTAP — PowerShell Toolkit Automation Environment
  Deploys EC2 Windows (interactive) or Lambda PowerShell (event-driven) for ONTAP management.
  Beginners can select their preferred execution environment via parameters.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Execution Environment"
        Parameters:
          - ExecutionMode
          - VpcId
          - SubnetId
      - Label:
          default: "FSx for ONTAP Configuration"
        Parameters:
          - FsxMgmtEndpointIp
          - SvmName
          - FsxAdminSecretArn
      - Label:
          default: "EC2 Configuration (EC2 mode only)"
        Parameters:
          - Ec2InstanceType
          - Ec2KeyPairName
          - Ec2AmiId
      - Label:
          default: "API Gateway (Lambda mode only)"
        Parameters:
          - EnableApiGateway
    ParameterLabels:
      ExecutionMode:
        default: "Execution Environment (EC2 or Lambda)"
      FsxMgmtEndpointIp:
        default: "FSx for ONTAP Management Endpoint IP"
      SvmName:
        default: "SVM Name"
      FsxAdminSecretArn:
        default: "Secrets Manager ARN (fsxadmin credentials)"

Parameters:
  ExecutionMode:
    Type: String
    Default: Lambda
    AllowedValues:
      - EC2
      - Lambda
      - Both
    Description: >
      EC2: Windows Server with PSTK pre-installed (interactive/RDP).
      Lambda: Serverless PowerShell functions (API-driven).
      Both: Deploy both environments.

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC where FSx for ONTAP resides

  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Private subnet with access to FSx management endpoint

  FsxMgmtEndpointIp:
    Type: String
    Description: FSx for ONTAP file system management endpoint IP address
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}$'

  SvmName:
    Type: String
    Default: svm1
    Description: Target SVM name for automation operations

  FsxAdminSecretArn:
    Type: String
    Description: >
      ARN of Secrets Manager secret containing fsxadmin credentials.
      Secret must have keys: username, password
    AllowedPattern: '^arn:aws:secretsmanager:.*'

  Ec2InstanceType:
    Type: String
    Default: t3.medium
    AllowedValues:
      - t3.small
      - t3.medium
      - t3.large
      - m5.large
    Description: EC2 instance type (EC2 mode only)

  Ec2KeyPairName:
    Type: String
    Default: ''
    Description: EC2 Key Pair for RDP access (optional, EC2 mode only)

  Ec2AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-windows-latest/Windows_Server-2022-English-Full-Base
    Description: Windows Server 2022 AMI (auto-resolved from SSM)

  EnableApiGateway:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Deploy API Gateway for Lambda functions (Lambda mode)

Conditions:
  DeployEc2: !Or
    - !Equals [!Ref ExecutionMode, 'EC2']
    - !Equals [!Ref ExecutionMode, 'Both']
  DeployLambda: !Or
    - !Equals [!Ref ExecutionMode, 'Lambda']
    - !Equals [!Ref ExecutionMode, 'Both']
  DeployApiGw: !And
    - !Condition DeployLambda
    - !Equals [!Ref EnableApiGateway, 'true']
  HasKeyPair: !Not [!Equals [!Ref Ec2KeyPairName, '']]

Resources:

  # ─────────────────────────────────────────────
  # Shared Resources
  # ─────────────────────────────────────────────

  FsxAccessSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow access to FSx for ONTAP management endpoint
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Sub '${FsxMgmtEndpointIp}/32'
          Description: HTTPS to FSx management endpoint
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Sub '${FsxMgmtEndpointIp}/32'
          Description: SSH to FSx management endpoint
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS outbound (PSGallery, AWS APIs)
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-fsx-access-sg'
        - Key: Purpose
          Value: PSTK-Automation

  # ─────────────────────────────────────────────
  # EC2 Windows Resources
  # ─────────────────────────────────────────────

  Ec2Role:
    Type: AWS::IAM::Role
    Condition: DeployEc2
    Properties:
      RoleName: !Sub '${AWS::StackName}-ec2-pstk-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: SecretsManagerReadOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref FsxAdminSecretArn

  Ec2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Condition: DeployEc2
    Properties:
      Roles:
        - !Ref Ec2Role

  Ec2Instance:
    Type: AWS::EC2::Instance
    Condition: DeployEc2
    Properties:
      ImageId: !Ref Ec2AmiId
      InstanceType: !Ref Ec2InstanceType
      IamInstanceProfile: !Ref Ec2InstanceProfile
      KeyName: !If [HasKeyPair, !Ref Ec2KeyPairName, !Ref 'AWS::NoValue']
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref FsxAccessSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-pstk-workstation'
        - Key: Purpose
          Value: PSTK-Automation
      UserData:
        Fn::Base64: !Sub |
          <powershell>
          # ═══════════════════════════════════════════════════
          # FSx for ONTAP — PSTK Auto-Setup (UserData)
          # ═══════════════════════════════════════════════════

          $ErrorActionPreference = "Continue"
          Start-Transcript -Path "C:\pstk-setup.log"

          Write-Host "[1/5] Installing NuGet provider..."
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted

          Write-Host "[2/5] Installing NetApp.ONTAP module..."
          Install-Module -Name NetApp.ONTAP -Force -AllowClobber -Scope AllUsers

          Write-Host "[3/5] Installing PowerShell 7..."
          $pwshUrl = "https://github.com/PowerShell/PowerShell/releases/download/v7.4.6/PowerShell-7.4.6-win-x64.msi"
          $pwshPath = "C:\pwsh7.msi"
          Invoke-WebRequest -Uri $pwshUrl -OutFile $pwshPath -UseBasicParsing
          Start-Process msiexec.exe -Wait -ArgumentList "/i $pwshPath /quiet ADD_EXPLORER_CONTEXT_MENU_OPENPOWERSHELL=1 ADD_FILE_CONTEXT_MENU_RUNPOWERSHELL=1 ENABLE_PSREMOTING=1 REGISTER_MANIFEST=1"

          Write-Host "[4/5] Creating connection test script..."
          $testScript = @"
          Import-Module NetApp.ONTAP
          `$secret = Get-SECSecretValue -SecretId '${FsxAdminSecretArn}' | ConvertFrom-Json
          `$cred = New-Object PSCredential(`$secret.username, (ConvertTo-SecureString `$secret.password -AsPlainText -Force))
          `$conn = Connect-NcController -Name '${FsxMgmtEndpointIp}' -Credential `$cred -HTTPS
          Write-Host "Connected to: `$(`$conn.Name) — ONTAP `$(`$conn.Version)"
          Get-NcVserver | Where-Object { `$_.VserverType -eq 'data' } | Format-Table Vserver, State, AllowedProtocols -AutoSize
          "@
          Set-Content -Path "C:\test-fsx-connection.ps1" -Value $testScript

          Write-Host "[5/5] Creating automation scripts directory..."
          New-Item -ItemType Directory -Path "C:\ontap-automation" -Force
          New-Item -ItemType Directory -Path "C:\ontap-automation\scripts" -Force

          # Save environment info
          @{
            FsxMgmtIp = '${FsxMgmtEndpointIp}'
            SvmName = '${SvmName}'
            SecretArn = '${FsxAdminSecretArn}'
            StackName = '${AWS::StackName}'
            Region = '${AWS::Region}'
          } | ConvertTo-Json | Set-Content "C:\ontap-automation\config.json"

          Stop-Transcript
          Write-Host "PSTK setup complete!"
          </powershell>

  # ─────────────────────────────────────────────
  # Lambda PowerShell Resources
  # ─────────────────────────────────────────────

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Condition: DeployLambda
    Properties:
      RoleName: !Sub '${AWS::StackName}-lambda-pstk-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: SecretsAndLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref FsxAdminSecretArn
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}*'

  # PowerShell Lambda Layer (NetApp.ONTAP module)
  PstkLambdaLayer:
    Type: AWS::Lambda::LayerVersion
    Condition: DeployLambda
    Properties:
      LayerName: !Sub '${AWS::StackName}-netapp-ontap-pstk'
      Description: NetApp.ONTAP PowerShell module for Lambda
      CompatibleRuntimes:
        - dotnet8
      CompatibleArchitectures:
        - x86_64
      Content:
        S3Bucket: !Sub '${AWS::StackName}-layers-${AWS::AccountId}'
        S3Key: layers/netapp-ontap-pstk.zip
      LicenseInfo: NetApp Community License

  # Shared configuration for Lambda functions
  OntapActionsFunction:
    Type: AWS::Serverless::Function
    Condition: DeployLambda
    Properties:
      FunctionName: !Sub '${AWS::StackName}-ontap-actions'
      Description: FSx for ONTAP management via PowerShell Toolkit
      Runtime: dotnet8
      Handler: OntapActions::OntapActions.Function::FunctionHandler
      CodeUri: functions/ontap-actions/
      MemorySize: 512
      Timeout: 120
      Architectures:
        - x86_64
      VpcConfig:
        SubnetIds:
          - !Ref SubnetId
        SecurityGroupIds:
          - !Ref FsxAccessSecurityGroup
      Role: !GetAtt LambdaExecutionRole.Arn
      Layers:
        - !Ref PstkLambdaLayer
      Environment:
        Variables:
          FSX_MGMT_IP: !Ref FsxMgmtEndpointIp
          SVM_NAME: !Ref SvmName
          SECRET_ARN: !Ref FsxAdminSecretArn
      Tags:
        Purpose: PSTK-Automation

  # ─────────────────────────────────────────────
  # API Gateway (Optional, Lambda mode)
  # ─────────────────────────────────────────────

  OntapApi:
    Type: AWS::Serverless::Api
    Condition: DeployApiGw
    Properties:
      StageName: v1
      Name: !Sub '${AWS::StackName}-ontap-automation-api'
      Description: API for FSx for ONTAP PSTK automation actions
      Auth:
        DefaultAuthorizer: AWS_IAM
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"

  # API Gateway → Lambda Integration
  ApiSharesFunction:
    Type: AWS::Serverless::Function
    Condition: DeployApiGw
    Properties:
      FunctionName: !Sub '${AWS::StackName}-api-shares'
      Description: CIFS Share management API handler
      Runtime: dotnet8
      Handler: OntapActions::OntapActions.SharesHandler::FunctionHandler
      CodeUri: functions/ontap-actions/
      MemorySize: 512
      Timeout: 30
      Architectures:
        - x86_64
      VpcConfig:
        SubnetIds:
          - !Ref SubnetId
        SecurityGroupIds:
          - !Ref FsxAccessSecurityGroup
      Role: !GetAtt LambdaExecutionRole.Arn
      Layers:
        - !Ref PstkLambdaLayer
      Environment:
        Variables:
          FSX_MGMT_IP: !Ref FsxMgmtEndpointIp
          SVM_NAME: !Ref SvmName
          SECRET_ARN: !Ref FsxAdminSecretArn
      Events:
        ListShares:
          Type: Api
          Properties:
            RestApiId: !Ref OntapApi
            Path: /shares
            Method: GET
        CreateShare:
          Type: Api
          Properties:
            RestApiId: !Ref OntapApi
            Path: /shares
            Method: POST

  ApiUsersFunction:
    Type: AWS::Serverless::Function
    Condition: DeployApiGw
    Properties:
      FunctionName: !Sub '${AWS::StackName}-api-users'
      Description: Local User/Group management API handler
      Runtime: dotnet8
      Handler: OntapActions::OntapActions.UsersHandler::FunctionHandler
      CodeUri: functions/ontap-actions/
      MemorySize: 512
      Timeout: 30
      Architectures:
        - x86_64
      VpcConfig:
        SubnetIds:
          - !Ref SubnetId
        SecurityGroupIds:
          - !Ref FsxAccessSecurityGroup
      Role: !GetAtt LambdaExecutionRole.Arn
      Layers:
        - !Ref PstkLambdaLayer
      Environment:
        Variables:
          FSX_MGMT_IP: !Ref FsxMgmtEndpointIp
          SVM_NAME: !Ref SvmName
          SECRET_ARN: !Ref FsxAdminSecretArn
      Events:
        ListUsers:
          Type: Api
          Properties:
            RestApiId: !Ref OntapApi
            Path: /users
            Method: GET
        CreateUser:
          Type: Api
          Properties:
            RestApiId: !Ref OntapApi
            Path: /users
            Method: POST

  ApiSnapshotsFunction:
    Type: AWS::Serverless::Function
    Condition: DeployApiGw
    Properties:
      FunctionName: !Sub '${AWS::StackName}-api-snapshots'
      Description: Snapshot management API handler
      Runtime: dotnet8
      Handler: OntapActions::OntapActions.SnapshotsHandler::FunctionHandler
      CodeUri: functions/ontap-actions/
      MemorySize: 512
      Timeout: 30
      Architectures:
        - x86_64
      VpcConfig:
        SubnetIds:
          - !Ref SubnetId
        SecurityGroupIds:
          - !Ref FsxAccessSecurityGroup
      Role: !GetAtt LambdaExecutionRole.Arn
      Layers:
        - !Ref PstkLambdaLayer
      Environment:
        Variables:
          FSX_MGMT_IP: !Ref FsxMgmtEndpointIp
          SVM_NAME: !Ref SvmName
          SECRET_ARN: !Ref FsxAdminSecretArn
      Events:
        ListSnapshots:
          Type: Api
          Properties:
            RestApiId: !Ref OntapApi
            Path: /snapshots
            Method: GET
        CreateSnapshot:
          Type: Api
          Properties:
            RestApiId: !Ref OntapApi
            Path: /snapshots
            Method: POST

  ApiVolumesFunction:
    Type: AWS::Serverless::Function
    Condition: DeployApiGw
    Properties:
      FunctionName: !Sub '${AWS::StackName}-api-volumes'
      Description: Volume information and management API handler
      Runtime: dotnet8
      Handler: OntapActions::OntapActions.VolumesHandler::FunctionHandler
      CodeUri: functions/ontap-actions/
      MemorySize: 512
      Timeout: 30
      Architectures:
        - x86_64
      VpcConfig:
        SubnetIds:
          - !Ref SubnetId
        SecurityGroupIds:
          - !Ref FsxAccessSecurityGroup
      Role: !GetAtt LambdaExecutionRole.Arn
      Layers:
        - !Ref PstkLambdaLayer
      Environment:
        Variables:
          FSX_MGMT_IP: !Ref FsxMgmtEndpointIp
          SVM_NAME: !Ref SvmName
          SECRET_ARN: !Ref FsxAdminSecretArn
      Events:
        ListVolumes:
          Type: Api
          Properties:
            RestApiId: !Ref OntapApi
            Path: /volumes
            Method: GET

Outputs:
  ExecutionMode:
    Description: Deployed execution environment
    Value: !Ref ExecutionMode

  Ec2InstanceId:
    Condition: DeployEc2
    Description: EC2 Instance ID (connect via SSM Session Manager)
    Value: !Ref Ec2Instance

  Ec2ConnectCommand:
    Condition: DeployEc2
    Description: SSM connect command
    Value: !Sub 'aws ssm start-session --target ${Ec2Instance}'

  ApiEndpoint:
    Condition: DeployApiGw
    Description: API Gateway endpoint for ONTAP automation
    Value: !Sub 'https://${OntapApi}.execute-api.${AWS::Region}.amazonaws.com/v1'

  SecurityGroupId:
    Description: Security Group for FSx access
    Value: !Ref FsxAccessSecurityGroup

  LambdaFunctionArn:
    Condition: DeployLambda
    Description: Main ONTAP Actions Lambda ARN
    Value: !GetAtt OntapActionsFunction.Arn
