name: Repository Name Redirect Check

# Deliberately not a pull-request gate. This job resolves every GitHub repository this
# repository's prose links to, so it fails for reasons unrelated to the change under
# review — a third-party repository going private, GitHub returning 503 — and a required
# check that does that is one people learn to force through.
#
# What it catches cannot be caught on a pull request anyway. A link is added while the
# name is correct and goes stale later, when the repository on the other end is renamed.
# GitHub keeps serving the old name through a redirect, so the link returns 200 and a
# link checker reports it healthy. The Adoption Playbook had seven repositories in that
# state at once, all reported reachable.
#
# Both steps read the REST API rather than fetching pages. The first version fetched
# github.com/<owner>/<repo> and compared the landing URL, and this job failed on its first
# real run: NetApp/FSx-ONTAP-samples-scripts and NetApp/fsxn-monitoring-auto-resizing
# returned 504 on all three attempts while nothing was wrong with either name. They answer
# the API immediately, and full_name also settles capitalisation, which a redirect cannot.

on:
  schedule:
    # Mondays 21:30 UTC (Tuesday 06:30 JST). Half an hour after the published-articles
    # check so the two do not report on the same minute; nothing depends on the order.
    - cron: "30 21 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-name-redirects
  cancel-in-progress: false

jobs:
  repo-names:
    name: "Stale repository names in links"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Resolve every referenced repository name
        # Exit 2 means the network was unusable and no verdict was reached. That is
        # reported as a failure here on purpose: this job has no other reason to run, so
        # a run that concluded nothing and reported success would let the check quietly
        # stop covering anything.
        #
        # The token lifts the API's 60/hour anonymous limit to 5,000. Without it the 29 names
        # here fit, but only just, and a second run in the same hour would report every name
        # as "could not be checked".
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check_repo_name_redirects.py
      - name: Verify the strings sibling repositories have registered against this one
        # Two repositories publish one line per string they depend on inside another
        # repository, and nothing here read either, so the first reword of one would have
        # surfaced in their CI rather than in the commit that caused it. Reading only the
        # first was the same gap reopened: S3-Burst-on-ONTAP-Files published its contract
        # after the reader landed and registered eight rows nobody looked at.
        #
        # `--fetch` because a runner has no sibling checkout. Without it the check skips,
        # and a gate that skips everywhere it runs automatically is not a gate. Exit 2 is
        # a failure for the same reason as the step above: the contract is published today,
        # so unreachable means the registration may be gone, not that it has yet to appear.
        run: python3 scripts/check_incoming_probes.py --fetch
      - name: Resolve the Playbook module hubs the generated sections link to
        # The check above resolves repository names and drops everything after owner/repo,
        # so the 24 hub paths written into 376 READMEs need their own pass. A renamed module
        # directory would 404 in every one of those files at once.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/sync_playbook_reading_section.py --verify-hubs
