name: Security & Privacy Check
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sensitive-data-check:
    name: "Sensitive Data Scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every `|| true` in this file is on a command substitution whose result is
      # then tested, e.g. `result=$(git ls-files ... || true)` followed by
      # `if [ -n "$result" ]; then ... exit 1; fi`. `git ls-files` and `grep` exit 1
      # when they match nothing, which under `set -e` would abort the step on the
      # CLEAN case — the opposite of what is wanted. The verdict comes from the `-n`
      # test and the explicit `exit 1`, not from the pipeline status, so nothing is
      # being discarded here. Audited 2026-08-15.
      - name: Check .kiro/ not tracked
        run: |
          result=$(git ls-files .kiro/ 2>/dev/null || true)
          if [ -n "$result" ]; then
            echo "::error::.kiro/ directory is tracked by git"
            exit 1
          fi
          echo "✅ .kiro/ not tracked"

      - name: Check .env files not tracked
        run: |
          result=$(git ls-files .env .env.local '.env.*' 2>/dev/null || true)
          if [ -n "$result" ]; then
            echo "::error::.env files are tracked by git: $result"
            exit 1
          fi
          echo "✅ .env files not tracked"

      - name: Check .pem files not tracked
        run: |
          result=$(git ls-files '*.pem' 2>/dev/null || true)
          if [ -n "$result" ]; then
            echo "::error::.pem files are tracked by git: $result"
            exit 1
          fi
          echo "✅ .pem files not tracked"

      - name: Check no personal file paths with secrets
        run: |
          # Check for personal paths referencing .pem files (exclude CI/security scripts)
          result=$(git ls-files | grep -v '.github/workflows/' | grep -v 'scripts/pre-push' | grep -v 'scripts/_check' | xargs grep -rln '/Users/.*\.pem' 2>/dev/null || true)
          if [ -n "$result" ]; then
            echo "::error::Personal .pem paths found in: $result"
            exit 1
          fi
          echo "✅ No personal .pem paths"

      # Runs unconditionally and needs no secret, which is what keeps the
      # account-ID coverage below out of a vacuous state. It is shape-based, so it
      # catches ANY real account ID rather than only a configured one.
      - name: Check account IDs are documented placeholders
        run: python3 scripts/check_account_id_placeholders.py

      - name: Check no real AWS account ID
        env:
          SECURITY_CHECK_ACCOUNT_ID: ${{ secrets.SECURITY_CHECK_ACCOUNT_ID }}
        run: |
          # An absent secret used to be indistinguishable from a clean result, so
          # this step sat green without ever running. It is now only the precise
          # half of a pair: the shape-based step above always runs, so skipping
          # here leaves coverage in place rather than leaving a silent hole, and a
          # fork pull request -- which cannot read secrets at all -- still gets
          # checked.
          if [ -z "$SECURITY_CHECK_ACCOUNT_ID" ]; then
            echo "::notice::SECURITY_CHECK_ACCOUNT_ID is not set, so the exact-match"
            echo "pass is skipped. The shape-based check in the previous step ran and"
            echo "covers any real account ID. Set the secret to also pin one specific"
            echo "ID, which additionally catches it in non-account-ID positions."
            exit 0
          fi
          result=$(git ls-files | xargs grep -rl "$SECURITY_CHECK_ACCOUNT_ID" 2>/dev/null || true)
          if [ -n "$result" ]; then
            echo "::error::Real AWS account ID found in: $result"
            exit 1
          fi
          echo "✅ No real AWS account ID in tracked files"

      - name: Check no hardcoded EC2 IPs
        run: |
          # Common patterns for real public IPs (non-placeholder)
          # Skip security check scripts themselves (they contain patterns to search for)
          result=$(git ls-files | grep -v 'scripts/pre-push' | grep -v 'scripts/_check' | grep -v '.github/workflows/' | xargs grep -rln '3\.112\.208\.171\|13\.113\.190\.197' 2>/dev/null || true)
          if [ -n "$result" ]; then
            echo "::error::Real EC2 IP addresses found in: $result"
            exit 1
          fi
          echo "✅ No known real EC2 IPs in tracked files"
