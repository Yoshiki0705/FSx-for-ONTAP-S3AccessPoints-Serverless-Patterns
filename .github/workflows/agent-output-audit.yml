name: Agent Output Audit (Naming / Neutrality / Leak / Parity)

on:
  push:
    branches: [main]
    paths:
      - '**.md'
      - '**.yaml'
      - '**.yml'
      - '**.py'
      - '**.sql'
      - '**.json'
      - '**.sh'
  pull_request:
    branches: [main]
    paths:
      - '**.md'
      - '**.yaml'
      - '**.yml'
      - '**.py'
      - '**.sql'
      - '**.json'
      - '**.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Agent Output Guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine changed files
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BASE="${{ github.event.before }}"
          else
            BASE=""
          fi

          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            # workflow_dispatch or initial commit — scan all tracked files
            CHANGED=$(git ls-files -- '*.md' '*.yaml' '*.yml' '*.py' '*.sql' '*.json' '*.sh')
          else
            CHANGED=$(git diff --name-only --diff-filter=ACMR "$BASE" HEAD)
          fi

          # Every `|| true` in this file is on a `grep` whose output is captured and
          # then tested — `HITS=$(grep ... || true)` followed by `if [ -n "$HITS" ]`,
          # `FAIL=1` and a closing `exit 1`. grep exits 1 when it matches nothing,
          # which is the clean case and must not abort the step. The verdict comes
          # from the `-n` test and the `exit 1`, so no scan result is discarded.
          # Audited 2026-08-15: 10 sites, all this shape.
          # Exclude CI/meta paths from audit
          CHANGED=$(echo "$CHANGED" | grep -vE '^(\.github/|AGENTS\.md|CONTRIBUTING|\.kiro/)' || true)

          # Split into markdown and text (all auditable) file lists
          MD_FILES=$(echo "$CHANGED" | grep -E '\.md$' || true)
          TEXT_FILES=$(echo "$CHANGED" | grep -E '\.(md|yaml|yml|py|sql|json|sh)$' || true)
          # Naming has its own list, wider than both. The standard covers code
          # comments as well as documents, and scanning only .md let the violation
          # sit in a shell comment, a Python comment and a CloudFormation
          # description indefinitely: nothing looked there. TypeScript is included
          # because the portal's user-facing strings live in .ts.
          NAMING_FILES=$(echo "$CHANGED" | grep -E '\.(md|yaml|yml|py|sql|json|sh|ts|tsx)$' || true)

          # Write to files for later steps
          echo "$MD_FILES" > /tmp/changed_md.txt
          echo "$TEXT_FILES" > /tmp/changed_text.txt
          echo "$NAMING_FILES" > /tmp/changed_naming.txt

          # grep -c prints "0" and exits 1 on no match; use `|| true` (not `|| echo 0`,
          # which would append a second line and break the GITHUB_OUTPUT format).
          MD_COUNT=$(grep -c . /tmp/changed_md.txt || true)
          TEXT_COUNT=$(grep -c . /tmp/changed_text.txt || true)
          NAMING_COUNT=$(grep -c . /tmp/changed_naming.txt || true)
          echo "md_count=${MD_COUNT:-0}" >> "$GITHUB_OUTPUT"
          echo "text_count=${TEXT_COUNT:-0}" >> "$GITHUB_OUTPUT"
          echo "naming_count=${NAMING_COUNT:-0}" >> "$GITHUB_OUTPUT"

      - name: "Check: Naming standard (changed docs, code and comments)"
        if: steps.changes.outputs.naming_count > 0
        run: |
          FAIL=0
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            [ ! -f "$file" ] && continue
            # The abbreviation alone missed the spelled-out form, and three documents
            # carried it past a green check because it is the same violation written
            # out and the pattern only knew the short one.
            #
            # The exclusions drop identifiers rather than prose: a CloudWatch
            # namespace that dashboards and alarms are keyed on, a parameter value,
            # and another project's name. Rewriting any of them would break something,
            # and reporting them would bury the real findings.
            #
            # Both lists are variables so the markers below can sit on their own line:
            # a pattern that bans a spelling has to contain that spelling.
            NAMING_PATTERN='\bFSxN\b|FSx ONTAP|FSx S3 AP|FSx S3 [Aa]ccess ?[Pp]oint'  # allow:naming
            NAMING_EXCLUDE='allow:naming|FSxN-S3AP|FSXN_S3AP|RAG-FSxN'  # allow:naming
            HITS=$(grep -nE "$NAMING_PATTERN" "$file" | grep -vE "$NAMING_EXCLUDE" || true)
            if [ -n "$HITS" ]; then
              echo "::error file=$file::Naming violation (use 'FSx for ONTAP' / 'FSx for ONTAP S3 AP')"
              echo "$HITS" | head -5
              FAIL=1
            fi
          done < /tmp/changed_naming.txt

          # Forbidden tools
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            [ ! -f "$file" ] && continue
            # Exclude lines with allow:vendor-ref. The rule bans *proposing* these
            # products. A document that records why we do not use one has to be
            # able to name it: a constraint written in euphemisms ("a vendor
            # management suite") is one no reader can check or act on.
            HITS=$(grep -nE 'Workload Factory|NetApp Console|BlueXP' "$file" | grep -v 'allow:vendor-ref' || true)
            if [ -n "$HITS" ]; then
              echo "::error file=$file::Forbidden tool reference (use native equivalents, or mark the line 'allow:vendor-ref' if it records a constraint rather than proposing the product)"
              echo "$HITS" | head -5
              FAIL=1
            fi
          done < /tmp/changed_md.txt

          if [ "$FAIL" -eq 1 ]; then
            echo "❌ Naming check failed on changed markdown files"
            exit 1
          fi
          echo "✅ Naming check passed"

      - name: "Check: Vendor neutrality (changed .md only)"
        if: steps.changes.outputs.md_count > 0
        run: |
          FAIL=0
          PATTERN='最強|game-changer|ゲームチェンジャー|競合ツール|優位性|より優れ|is better than|is superior to'
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            [ ! -f "$file" ] && continue
            HITS=$(grep -nE "$PATTERN" "$file" || true)
            if [ -n "$HITS" ]; then
              echo "::error file=$file::Vendor neutrality violation"
              echo "$HITS" | head -5
              FAIL=1
            fi
          done < /tmp/changed_md.txt

          if [ "$FAIL" -eq 1 ]; then
            echo "❌ Neutrality check failed"
            exit 1
          fi
          echo "✅ Neutrality check passed"

      - name: "Check: Public-output leak (changed text files)"
        if: steps.changes.outputs.text_count > 0
        env:
          PROJECT_CONTEXT_NAMES: ${{ secrets.PROJECT_CONTEXT_NAMES }}
        run: |
          FAIL=0
          PATTERN='DB-I-[0-9]+'
          if [ -n "$PROJECT_CONTEXT_NAMES" ]; then
            PATTERN="${PROJECT_CONTEXT_NAMES}|${PATTERN}"
          fi

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            [ ! -f "$file" ] && continue
            HITS=$(grep -nE "$PATTERN" "$file" || true)
            if [ -n "$HITS" ]; then
              # Output file:line only — never echo match content
              echo "::error file=$file::Potential leak detected"
              echo "$HITS" | cut -d: -f1,2
              FAIL=1
            fi
          done < /tmp/changed_text.txt

          if [ "$FAIL" -eq 1 ]; then
            echo "❌ Leak check failed — see file:line references above"
            exit 1
          fi
          echo "✅ Leak check passed"

      # A real support case number reached this repository and stayed: a table row
      # reading `| **ケース番号** | <15 digits> |`. The local commit hook looks for
      # `case` next to digits, and that row labels it in Japanese with a bare number,
      # so the pattern had nothing to match. CI checked for case numbers not at all.
      #
      # Two shapes are refused. A case-number label carrying a long run of digits,
      # and the API's own case-id format unless its account field is the documented
      # placeholder. The deferral this repository already uses -- "ケース番号は本
      # リポジトリには記載しません" -- carries no digits and passes.
      - name: "Check: Support case numbers (changed text files)"
        if: steps.changes.outputs.text_count > 0
        run: |
          FAIL=0
          LABELLED='(ケース番号|ケース *ID|[Cc]ase *(number|ID|id))[^0-9]{0,40}[0-9]{10,}'
          APIFORM='case-[0-9]{12}-(mu|mj|mc|s0)[a-zA-Z]{2}-[0-9]{4}-[A-Za-z0-9]+'
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            [ ! -f "$file" ] && continue
            # The documented placeholder account is filtered from both, not just the
            # API-format check: `Case ID: case-123456789012-...` satisfies the labelled
            # pattern too, and refusing the repository's own example would make this
            # check something people route around.
            HITS=$(grep -nEo "$LABELLED" "$file" | grep -v '123456789012' || true)
            API_HITS=$(grep -nEo "$APIFORM" "$file" | grep -v 'case-123456789012-' || true)
            if [ -n "$HITS" ] || [ -n "$API_HITS" ]; then
              # file:line only. Echoing the match would put the number in the log.
              echo "::error file=$file::Support case number in a public file"
              { [ -n "$HITS" ] && echo "$HITS"; [ -n "$API_HITS" ] && echo "$API_HITS"; } | cut -d: -f1
              FAIL=1
            fi
          done < /tmp/changed_text.txt
          if [ "$FAIL" -eq 1 ]; then
            echo "❌ A support case number must not be committed. Track it in .private/ and"
            echo "   reference the case by topic here."
            exit 1
          fi
          echo "✅ No support case numbers in the changed files"

      - name: "Check: JA/EN parity (warning only)"
        if: steps.changes.outputs.md_count > 0
        run: |
          # Two JA/EN conventions are used in this repo:
          #   1. path-based:    docs/ja/foo.md  <-> docs/en/foo.md
          #   2. sibling-based: docs/foo.md     <-> docs/foo.en.md
          # Both are checked. Warning-only: several known gaps predate this check.
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            [ ! -f "$file" ] && continue
            case "$file" in
              *.en.md) continue ;;   # already the English side
            esac

            EN_FILE=""
            # Convention 1: /ja/ -> /en/
            CANDIDATE=$(echo "$file" | sed 's|/ja/|/en/|')
            if [ "$file" != "$CANDIDATE" ] && [ -f "$CANDIDATE" ]; then
              EN_FILE="$CANDIDATE"
            else
              # Convention 2: foo.md -> foo.en.md
              CANDIDATE="${file%.md}.en.md"
              if [ -f "$CANDIDATE" ]; then
                EN_FILE="$CANDIDATE"
              elif grep -q "$(basename "$CANDIDATE")" "$file" 2>/dev/null; then
                # The doc advertises an English version that does not exist.
                echo "::warning file=$file::JA/EN parity: links to $(basename "$CANDIDATE") but that file is missing"
                continue
              fi
            fi

            [ -z "$EN_FILE" ] && continue

            JA_SECTIONS=$(grep -c '^##' "$file" || echo 0)
            EN_SECTIONS=$(grep -c '^##' "$EN_FILE" || echo 0)
            if [ "$JA_SECTIONS" -ne "$EN_SECTIONS" ]; then
              echo "::warning file=$file::JA/EN parity: JA has ${JA_SECTIONS} sections, EN ($EN_FILE) has ${EN_SECTIONS}"
            fi
          done < /tmp/changed_md.txt
          echo "✅ Parity check complete (warnings only)"

      # The section-count check above passes whenever both files have the same
      # number of headings, which is not the same as both saying the same thing.
      # docs/ja|en/ad-joined-svm-s3ap-prerequisites.md matched 1:1 on headings
      # while the JA monitoring section was missing the Lambda definition its own
      # snippet referenced — the snippet could not be copied and used, and the
      # count check reported the pair as aligned.
      #
      # This compares fenced code blocks, table rows and list items per matching
      # section. Not line counts: Japanese prose is denser and the EN files are
      # soft-wrapped near 80 columns, which on the largest pair here accounts for
      # an 83-line gap with identical content.
      #
      # Ratcheted rather than strict. The baseline can only go down — lower it when
      # gaps are closed.
      #
      # Started at 69 across 9 of 15 pairs. Now 50 across 5 pairs, after closing
      # portal-authorization-design (JA was missing 10 sections, including the
      # AppSync authorization patterns and the UI-behaviour matrix),
      # portal-deployment-runbook (8 per-section gaps), and one table row each in
      # portal-compliance-guide and portal-user-guide.
      #
      # The remaining 50 sit in 5 pairs whose section lists differ, so the
      # positional comparison misaligns and the reported number is not the amount
      # of work: amplify-hosting-production-guide 26 (JA 16 / EN 19 sections),
      # storage-browser-demo-guide 12 (22/23), ai-features-quick-start 8 (11/12),
      # deployment-guide 3 (49/58), portal-authorization-model 1 (14/15).
      - name: "Check: JA/EN structural parity (ratcheted)"
        run: python3 scripts/check_doc_structural_parity.py --max-mismatches 50
