name: GitHub Actions Security Lint (zizmor)

on:
  push:
    branches: [main, develop]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  schedule:
    # 毎週月曜 09:00 UTC (日本時間 18:00)
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  zizmor:
    name: zizmor (Actions Security Lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install zizmor
        run: |
          pip install zizmor

      # `|| true` is deliberate HERE and only here: zizmor exits non-zero when it
      # finds anything, and the SARIF file has to exist for the upload step below
      # regardless of the verdict. Discarding the status of the report-writing run
      # is safe because the run that decides the outcome is the blocking one after
      # the upload.
      - name: Run zizmor scan (writes SARIF for code scanning)
        run: |
          echo "🔍 GitHub Actions セキュリティリント実行中..."
          zizmor --format sarif . > zizmor-results.sarif || true

      - name: Upload SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: zizmor-results.sarif
          category: zizmor

      # This one used to end in `|| true` as well, which meant the workflow named
      # "GitHub Actions Security Lint" could not fail — a finding was uploaded to
      # code scanning and the job went green, so nothing stopped a pull request that
      # introduced one. Measured 2026-08-15 on this tree: `zizmor .` exits 0 with
      # "No findings to report (55 suppressed)", so making it blocking costs nothing
      # today and is the only reason the step means anything tomorrow.
      - name: Run zizmor (blocking)
        run: |
          echo "📋 zizmor 結果サマリー:"
          zizmor .
