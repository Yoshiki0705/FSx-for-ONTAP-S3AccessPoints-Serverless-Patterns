name: Lint
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install ruff
        # Pin to the requirements-dev.txt version so `ruff format --check` is reproducible
        # (a floating `pip install ruff` can drift the formatter target between runs).
        # Read the pin from that file instead of repeating it, so bumping one place
        # cannot leave this job on a different formatter than `make lint` uses.
        run: pip install "$(grep -m1 '^ruff==' requirements-dev.txt)"
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  cfn-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install cfn-lint
        run: pip install "$(grep -m1 '^cfn-lint==' requirements-dev.txt)"
      - name: Lint deployment templates
        run: cfn-lint solutions/**/template-deploy.yaml --ignore-checks W || echo "::warning::cfn-lint found issues in deployment templates (non-blocking)"
      - name: Validate self-contained SAM templates (Issue #53 regression guard)
        run: python3 scripts/validate_sam_templates.py
      - name: Check README deploy params match templates (Issue #53 regression guard)
        run: python3 scripts/check_readme_param_names.py
      - name: Check deploy-doc parity across languages
        run: python3 scripts/check_readme_deploy_parity.py
