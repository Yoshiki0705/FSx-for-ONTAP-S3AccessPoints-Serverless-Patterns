name: CI - Test & Validate
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: "Stage 1: CloudFormation Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install cfn-lint
        # Read the pin from requirements-dev.txt rather than repeating the version.
        # A floating `pip install cfn-lint` lets a new release fail this job on
        # unchanged templates.
        run: pip install "$(grep -m1 '^cfn-lint==' requirements-dev.txt)"
      - name: Lint all CloudFormation templates
        id: cfn-lint
        run: |
          cfn-lint '**/*.yaml' --ignore-templates '**/node_modules/**' || echo "lint_failed=true" >> $GITHUB_ENV
      - name: Set lint outcome
        if: env.lint_failed == 'true'
        run: echo "LINT_RESULT=failure" >> $GITHUB_OUTPUT

  test:
    name: "Stage 2: Unit Tests & PBT"
    runs-on: ubuntu-latest
    if: always()
    env:
      # Dummy region/creds so module-level boto3 clients don't raise NoRegionError at import.
      AWS_DEFAULT_REGION: ap-northeast-1
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Cache pip dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-dev.txt', 'requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Cache Hypothesis database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .hypothesis
          key: ${{ runner.os }}-hypothesis-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-hypothesis-
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run shared tests with coverage
        run: |
          pytest \
            shared/tests/ \
            --cov=shared \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            -v --ignore=.hypothesis
      - name: Run pattern tests
        # Directories come from pattern-test-dirs.txt, which the Makefile `test`
        # target also reads. This step used to carry its own copy of the list, and
        # the two drifted: CI ran 37 directories, the Makefile 16, and 13 with
        # passing tests (~790 tests) appeared in neither, so they never ran anywhere.
        #
        # Each pattern gets its OWN pytest invocation. Many patterns ship a
        # functions/ package with colliding module names (e.g. functions.discovery),
        # so a single combined invocation raises ModuleNotFoundError as sys.modules
        # caches the first pattern's package. A fresh process per pattern avoids this.
        # See AGENTS.md "from functions.xxx import collision in batch test runs".
        run: |
          set -e
          grep -v '^#' pattern-test-dirs.txt | grep -v '^$' | while read -r d; do
            echo "::group::pytest $d"
            pytest "$d/tests/" -q --ignore=.hypothesis
            echo "::endgroup::"
          done
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/

  runtime-compat:
    name: "Stage 2a: Python Runtime Compatibility"
    runs-on: ubuntu-latest
    if: always()
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      AWS_DEFAULT_REGION: ap-northeast-1
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run shared module import smoke test
        run: |
          python -c "
          import shared.s3ap_helper
          import shared.ontap_client
          import shared.fsx_helper
          import shared.exceptions
          import shared.observability
          import shared.human_review
          import shared.data_classification
          import shared.idempotency_checker
          import shared.lineage
          import shared.guardrails
          import shared.slo
          print(f'All shared modules imported successfully on Python {__import__(\"sys\").version}')
          "
      - name: Run shared tests (quick subset)
        run: |
          pytest shared/tests/ -q --ignore=.hypothesis -x

  staleness-checks:
    name: "Stage 2c: Generated File Staleness"
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      # Verify JA/EN README section parity (same heading count)
      - name: README JA/EN section parity check
        run: |
          JA_HEADINGS=$(grep -c '^##' docs/ja/deployment-guide.md 2>/dev/null || echo 0)
          EN_HEADINGS=$(grep -c '^##' docs/en/deployment-guide.md 2>/dev/null || echo 0)
          if [ "$JA_HEADINGS" != "$EN_HEADINGS" ] && [ "$JA_HEADINGS" != "0" ] && [ "$EN_HEADINGS" != "0" ]; then
            echo "::warning::JA/EN deployment-guide heading count mismatch: JA=$JA_HEADINGS EN=$EN_HEADINGS"
          fi
      # Verify naming standardization (no forbidden abbreviations in committed docs)
      - name: Naming standardization audit
        run: |
          # Check for forbidden abbreviations (FSxN, bare FSx, FSx ONTAP without "for")
          # Exclude .private/, .git/, binary files
          VIOLATIONS=$(grep -rn --include='*.md' --include='*.yaml' --include='*.py' \
            -E '\bFSxN\b|(?<!\bfor )ONTAP\b.*\bFSx\b' \
            docs/ solutions/ operations/ shared/ 2>/dev/null | \
            grep -v 'FSx for ONTAP' | grep -v '# allow:naming' | \
            grep -v '.private/' || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "::warning::Naming standardization violations found (FSxN / bare FSx):"
            echo "$VIOLATIONS"
          fi
      # Verify no placeholder leaks (real AWS account IDs, internal IPs)
      - name: Public output safety audit
        run: |
          set +e
          LEAKS=$(grep -rn --include='*.md' --include='*.yaml' --include='*.py' --include='*.json' \
            -E '[0-9]{12}' \
            docs/ solutions/ operations/ shared/ scripts/ cfn-params/ 2>/dev/null | \
            grep -v '123456789012' | \
            grep -v 'node_modules' | \
            grep -v '.private/' | \
            grep -v 'example' | \
            grep -v '#.*AWS' || true)
          if [ -n "$LEAKS" ]; then
            echo "::warning::Potential AWS account ID leaks detected (review manually):"
            echo "$LEAKS" | head -20
          fi

  portal-test:
    name: "Stage 2b: Amplify Portal (vitest + tsc)"
    runs-on: ubuntu-latest
    if: always()
    defaults:
      run:
        working-directory: solutions/amplify-portal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: solutions/amplify-portal/package-lock.json
      - name: Install dependencies
        run: npm install --ignore-scripts
      # backend.ts imports ./portal-config, which is gitignored. tsconfig now
      # includes amplify/, so this step is what makes the backend definition
      # type-checkable at all — previously amplify/ was outside the include list
      # and this copy had no effect on what tsc looked at.
      - name: Create portal-config (required for tsc)
        run: cp amplify/portal-config.example.ts amplify/portal-config.ts
      - name: TypeScript type check
        run: npx tsc --noEmit
      - name: ESLint
        run: npm run lint
      - name: Run vitest
        run: npx vitest run
      # src/main.tsx imports ../amplify_outputs.json, which `ampx sandbox`
      # generates and .gitignore excludes — so `npm run build` cannot resolve it
      # on a clean checkout, only on a machine that has already deployed a
      # sandbox. The import already carries a @ts-ignore acknowledging the file
      # "may not exist before first sandbox deploy".
      #
      # A placeholder is enough here: the build only needs the module to resolve.
      # The real values are read at runtime by Amplify.configure(), which this
      # job never reaches.
      - name: Create amplify_outputs placeholder (build-time only)
        run: |
          if [ ! -f amplify_outputs.json ]; then
            echo '{"version":"1.4"}' > amplify_outputs.json
          fi
      # tsc does not exercise the CSS pipeline. Vite 8 minifies with
      # lightningcss, which rejects malformed CSS that esbuild used to tolerate,
      # so a build is the only step that catches it.
      - name: Production build
        run: npm run build

  security-cfn:
    name: "Stage 3: cfn-guard Security"
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cfn-guard
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/aws-cloudformation/cloudformation-guard/main/install-guard.sh | sh
          export PATH=~/.guard/bin:$PATH
          echo "$HOME/.guard/bin" >> $GITHUB_PATH
      - name: Run cfn-guard validation
        # Advisory scan (matches validators.yml cfn-guard-security). The prior quoted
        # '**/*.yaml' was passed literally and failed with "path does not exist".
        run: |
          cfn-guard validate \
            --rules security/cfn-guard-rules/ \
            --data solutions/**/template-deploy.yaml \
            --show-summary fail || true

  security-python:
    name: "Stage 4: Python Security Scan"
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install security tools
        # Pins come from requirements-dev.txt so a scan result is attributable to a
        # known tool version.
        run: pip install "$(grep -m1 '^bandit==' requirements-dev.txt)" "$(grep -m1 '^pip-audit==' requirements-dev.txt)"
      - name: Run Bandit scan
        # Runs the Makefile target so the pipeline and a laptop cannot scan
        # different trees. What this replaces: a comprehensive scan ending in
        # `|| true`, which wrote a report and failed nothing, plus a blocking scan
        # covering `shared/` and three of the twenty-eight industry patterns. Two
        # SQL injection vectors and two High findings sat in the gap between them,
        # and `make security` could not have caught them either — the target was
        # missing from `.PHONY` and collided with the `security/` directory, so make
        # answered "up to date" without running bandit at all.
        run: make security
      - name: Build Bandit report for the artifact
        if: always()
        run: make security-report
      - name: Run pip-audit
        run: pip-audit -r requirements.txt
      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bandit-report
          path: bandit-report.json

  final-status:
    name: "CI Final Status"
    runs-on: ubuntu-latest
    needs: [lint, test, runtime-compat, staleness-checks, portal-test, security-cfn, security-python]
    if: always()
    steps:
      - name: Check all stages
        run: |
          if [[ "${{ needs.lint.result }}" == "failure" ]] || \
             [[ "${{ needs.test.result }}" == "failure" ]] || \
             [[ "${{ needs.runtime-compat.result }}" == "failure" ]] || \
             [[ "${{ needs.security-cfn.result }}" == "failure" ]] || \
             [[ "${{ needs.security-python.result }}" == "failure" ]]; then
            echo "❌ One or more CI stages failed"
            echo "  Lint: ${{ needs.lint.result }}"
            echo "  Test: ${{ needs.test.result }}"
            echo "  Runtime Compat: ${{ needs.runtime-compat.result }}"
            echo "  Staleness: ${{ needs.staleness-checks.result }}"
            echo "  Portal: ${{ needs.portal-test.result }}"
            echo "  Security (CFN): ${{ needs.security-cfn.result }}"
            echo "  Security (Python): ${{ needs.security-python.result }}"
            exit 1
          fi
          echo "✅ All CI stages passed"
