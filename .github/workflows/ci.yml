name: CI - Test & Validate
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: "Stage 1: CloudFormation Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install cfn-lint
        # Read the pin from requirements-dev.txt rather than repeating the version.
        # A floating `pip install cfn-lint` lets a new release fail this job on
        # unchanged templates.
        run: pip install "$(grep -m1 '^cfn-lint==' requirements-dev.txt)"
      - name: Lint all CloudFormation templates
        id: cfn-lint
        run: |
          cfn-lint '**/*.yaml' --ignore-templates '**/node_modules/**' || echo "lint_failed=true" >> $GITHUB_ENV
      - name: Set lint outcome
        if: env.lint_failed == 'true'
        run: echo "LINT_RESULT=failure" >> $GITHUB_OUTPUT

  test:
    name: "Stage 2: Unit Tests & PBT"
    runs-on: ubuntu-latest
    if: always()
    env:
      # Dummy region/creds so module-level boto3 clients don't raise NoRegionError at import.
      AWS_DEFAULT_REGION: ap-northeast-1
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Cache pip dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-dev.txt', 'requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Cache Hypothesis database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .hypothesis
          key: ${{ runner.os }}-hypothesis-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-hypothesis-
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run shared tests with coverage
        run: |
          pytest \
            shared/tests/ \
            --cov=shared \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            -v --ignore=.hypothesis
      - name: Run pattern tests
        # Directories come from pattern-test-dirs.txt, which the Makefile `test`
        # target also reads. This step used to carry its own copy of the list, and
        # the two drifted: CI ran 37 directories, the Makefile 16, and 13 with
        # passing tests (~790 tests) appeared in neither, so they never ran anywhere.
        #
        # Each pattern gets its OWN pytest invocation. Many patterns ship a
        # functions/ package with colliding module names (e.g. functions.discovery),
        # so a single combined invocation raises ModuleNotFoundError as sys.modules
        # caches the first pattern's package. A fresh process per pattern avoids this.
        # See AGENTS.md "from functions.xxx import collision in batch test runs".
        run: |
          set -e
          grep -v '^#' pattern-test-dirs.txt | grep -v '^$' | while read -r d; do
            echo "::group::pytest $d"
            pytest "$d/tests/" -q --ignore=.hypothesis
            echo "::endgroup::"
          done
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/

  runtime-compat:
    name: "Stage 2a: Python Runtime Compatibility"
    runs-on: ubuntu-latest
    if: always()
    strategy:
      matrix:
        # Lowest entry equals `requires-python` in pyproject.toml; highest equals
        # `PY_VERSION` in the Makefile, which is the deployed Lambda runtime.
        # 3.11 was here while the project declared `>=3.12`, so the build was gated
        # on a version it does not support. scripts/check_lambda_runtime_agrees.py
        # keeps the three in agreement.
        python-version: ["3.12", "3.13"]
    env:
      AWS_DEFAULT_REGION: ap-northeast-1
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run shared module import smoke test
        run: |
          python -c "
          import shared.s3ap_helper
          import shared.ontap_client
          import shared.fsx_helper
          import shared.exceptions
          import shared.observability
          import shared.human_review
          import shared.data_classification
          import shared.idempotency_checker
          import shared.lineage
          import shared.guardrails
          import shared.slo
          print(f'All shared modules imported successfully on Python {__import__(\"sys\").version}')
          "
      - name: Run shared tests (quick subset)
        run: |
          pytest shared/tests/ -q --ignore=.hypothesis -x

  staleness-checks:
    name: "Stage 2c: Generated File Staleness"
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      # Verify JA/EN README section parity (same heading count)
      - name: README JA/EN section parity check
        run: |
          JA_HEADINGS=$(grep -c '^##' docs/ja/deployment-guide.md 2>/dev/null || echo 0)
          EN_HEADINGS=$(grep -c '^##' docs/en/deployment-guide.md 2>/dev/null || echo 0)
          if [ "$JA_HEADINGS" != "$EN_HEADINGS" ] && [ "$JA_HEADINGS" != "0" ] && [ "$EN_HEADINGS" != "0" ]; then
            echo "::warning::JA/EN deployment-guide heading count mismatch: JA=$JA_HEADINGS EN=$EN_HEADINGS"
          fi
      # Both audits below are WHOLE-TREE and ADVISORY, and that is deliberate — but
      # it was not stated anywhere, so a green check read as "the rule is enforced".
      # The enforcing versions are in agent-output-audit.yml, which runs the same two
      # rules over the CHANGED files and calls `exit 1`. These wide scans exist only
      # to surface pre-existing debt the changed-files gate cannot see.
      #
      # They stay advisory because they cannot be anything else yet. Measured
      # 2026-08-15 with an ERE-valid pattern: the naming scan reports 1,051 lines and
      # the account-ID scan 1,604, overwhelmingly false positives — `.aws-sam/build/`
      # artefacts, a CloudWatch namespace literal in the edge handlers, doc
      # placeholders such as 234567890123, and AWS's own public ECR account
      # 763104351884. Making them blocking would fail every pull request on untouched
      # debt, and a gate that does that gets switched off within a week.
      #
      # `|| true` on the grep itself is the ordinary no-match idiom (grep exits 1 when
      # it matches nothing) and is not what made these advisory; the absence of an
      # `exit 1` is.
      - name: Naming standardization audit (advisory; enforced on changed files in agent-output-audit.yml)
        run: |
          # The pattern was `\bFSxN\b|(?<!\bfor )ONTAP\b.*\bFSx\b`. `(?<!...)` is a
          # PCRE lookbehind and POSIX ERE has no such construct, so `grep -E` never
          # ran it as written: GNU grep warns "? at start of expression" and evaluates
          # a mangled expression, while BSD grep (a contributor's Mac) fails outright
          # with "repetition-operator operand invalid" and exit 2. Either way the
          # second alternative could not do what it claimed. Replaced with the literal
          # forbidden forms, which is what the rule actually is.
          # The pattern and the `allow:naming` exclusion share a line on purpose: this
          # line necessarily contains the forbidden forms it searches for, and the
          # commit gate reads the exclusion marker per line. Same shape as
          # agent-output-audit.yml.
          PATTERN='\bFSxN\b|\bFSx ONTAP\b|\bFSx S3 AP\b'  # grep -v 'allow:naming' applies below
          VIOLATIONS=$(grep -rn --include='*.md' --include='*.yaml' --include='*.py' \
            -E "$PATTERN" \
            docs/ solutions/ operations/ shared/ 2>/dev/null | \
            grep -v 'allow:naming' | \
            grep -v '\.private/' | \
            grep -v '\.aws-sam/' || true)
          COUNT=$(printf '%s' "$VIOLATIONS" | grep -c . || true)
          if [ "${COUNT:-0}" -gt 0 ]; then
            echo "::warning::Naming audit (advisory): ${COUNT} line(s) contain a forbidden form"
            printf '%s\n' "$VIOLATIONS" | head -20
          fi
      - name: Public output safety audit (advisory; enforced on changed files in agent-output-audit.yml and gitleaks.yml)
        run: |
          LEAKS=$(grep -rn --include='*.md' --include='*.yaml' --include='*.py' --include='*.json' \
            -E '[0-9]{12}' \
            docs/ solutions/ operations/ shared/ scripts/ cfn-params/ 2>/dev/null | \
            grep -v '123456789012' | \
            grep -v 'node_modules' | \
            grep -v '\.private/' | \
            grep -v '\.aws-sam/' | \
            grep -v 'example' | \
            grep -v '#.*AWS' || true)
          COUNT=$(printf '%s' "$LEAKS" | grep -c . || true)
          if [ "${COUNT:-0}" -gt 0 ]; then
            echo "::warning::Account-ID audit (advisory): ${COUNT} line(s) to review; file:line only"
            printf '%s\n' "$LEAKS" | head -20 | cut -d: -f1,2
          fi

  portal-test:
    name: "Stage 2b: Amplify Portal (vitest + tsc)"
    runs-on: ubuntu-latest
    if: always()
    defaults:
      run:
        working-directory: solutions/amplify-portal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: solutions/amplify-portal/package-lock.json
      # `npm ci`, not `npm install`: this step is the only thing that notices when
      # package-lock.json drifts out of sync with package.json. It had drifted, and
      # because this job used `npm install` — which happily re-resolves — the break
      # was invisible here and showed up only in the two places that use `npm ci`:
      # the weekly Portal E2E workflow and the Dockerfile.
      #
      # The drift returns on its own: a plain `npm install` deletes the four nested
      # `@opentelemetry/core@2.0.0` entries that `npm ci` requires, because
      # `@opentelemetry/resources@2.0.0` and `sdk-trace-base@2.0.0` pin core to
      # exactly 2.0.0 while the hoisted copy is 2.10.0. Restore them with
      # `npm install --package-lock-only`, which adds the entries and changes no
      # versions. Keep this step on `npm ci` so a recurrence fails here first.
      - name: Install dependencies
        run: npm ci --ignore-scripts
      # backend.ts imports ./portal-config, which is gitignored. tsconfig now
      # includes amplify/, so this step is what makes the backend definition
      # type-checkable at all — previously amplify/ was outside the include list
      # and this copy had no effect on what tsc looked at.
      - name: Create portal-config (required for tsc)
        run: cp amplify/portal-config.example.ts amplify/portal-config.ts
      - name: TypeScript type check
        run: npx tsc --noEmit
      - name: ESLint
        run: npm run lint
      - name: Run vitest
        run: npx vitest run
      # cdk-nag, held to a baseline. This job is where it belongs rather than in the
      # Python validators: it needs node_modules and the portal-config copied above.
      #
      # It used to be a manual check nobody could run — the documented command
      # (`CDK_NAG=1 npx ampx generate outputs`) reads a deployed stack's outputs and
      # never synthesises, so it reported nothing whether or not there were findings.
      # `npm run nag` synthesises without deploying; the baseline makes a new finding
      # fail while the 105 recorded ones stay recorded with a reason each.
      - name: cdk-nag against the baseline
        working-directory: .
        run: python3 scripts/check_cdk_nag_baseline.py
      # src/main.tsx imports ../amplify_outputs.json, which `ampx sandbox`
      # generates and .gitignore excludes — so `npm run build` cannot resolve it
      # on a clean checkout, only on a machine that has already deployed a
      # sandbox. The import already carries a @ts-ignore acknowledging the file
      # "may not exist before first sandbox deploy".
      #
      # A placeholder is enough here: the build only needs the module to resolve.
      # The real values are read at runtime by Amplify.configure(), which this
      # job never reaches.
      - name: Create amplify_outputs placeholder (build-time only)
        run: |
          if [ ! -f amplify_outputs.json ]; then
            echo '{"version":"1.4"}' > amplify_outputs.json
          fi
      # tsc does not exercise the CSS pipeline. Vite 8 minifies with
      # lightningcss, which rejects malformed CSS that esbuild used to tolerate,
      # so a build is the only step that catches it.
      - name: Production build
        run: npm run build


  # solutions/storage-browser-demo is the repository's second npm project and had
  # no job at all. It sat on React 18, Vite 6 and TypeScript 5.6 while the portal
  # moved to 19/8/6, and nothing would have reported it breaking. Its `build`
  # script runs `tsc && vite build`, so one step covers types and bundling.
  storage-browser-demo-build:
    name: "Stage 2c: Storage Browser demo (tsc + vite build)"
    runs-on: ubuntu-latest
    if: always()
    defaults:
      run:
        working-directory: solutions/storage-browser-demo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: solutions/storage-browser-demo/package-lock.json
      # npm ci for the same reason as the portal job: it is what fails when the
      # lockfile stops matching package.json.
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Production build
        run: npm run build

  # The cfn-guard job that stood here was a byte-for-byte duplicate of
  # validators.yml `cfn-guard-security`, and both were broken the same way: the
  # `solutions/**/template-deploy.yaml` glob is not expanded by the default Actions
  # shell, so cfn-guard received the literal string, exited 255 with "path does not
  # exist", and `|| true` reported success. Two copies of a scan that validated zero
  # templates is not twice the coverage; it is two places to fix the same fault and
  # one more chance to fix only one of them. The single remaining job lives in
  # validators.yml, which now also blocks when a rule file cannot be parsed.

  security-python:
    name: "Stage 4: Python Security Scan"
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install security tools
        # Pins come from requirements-dev.txt so a scan result is attributable to a
        # known tool version.
        run: pip install "$(grep -m1 '^bandit==' requirements-dev.txt)" "$(grep -m1 '^pip-audit==' requirements-dev.txt)"
      - name: Run Bandit scan
        # Runs the Makefile target so the pipeline and a laptop cannot scan
        # different trees. What this replaces: a comprehensive scan ending in
        # `|| true`, which wrote a report and failed nothing, plus a blocking scan
        # covering `shared/` and three of the twenty-eight industry patterns. Two
        # SQL injection vectors and two High findings sat in the gap between them,
        # and `make security` could not have caught them either — the target was
        # missing from `.PHONY` and collided with the `security/` directory, so make
        # answered "up to date" without running bandit at all.
        run: make security
      - name: Build Bandit report for the artifact
        if: always()
        run: make security-report
      - name: Run pip-audit
        run: pip-audit -r requirements.txt
      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bandit-report
          path: bandit-report.json

  final-status:
    name: "CI Final Status"
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
      - runtime-compat
      - staleness-checks
      - portal-test
      - storage-browser-demo-build
      # `security-cfn` used to be listed here. The job was removed on 2026-08-15 as a
      # duplicate of validators.yml `cfn-guard-security`, and this reference was left
      # behind. GitHub rejects a workflow whose `needs` names a job that does not
      # exist, so from that day **this entire workflow stopped starting** -- 94 runs
      # recorded as failures without executing a single step, and no pull request run
      # at all. cfn-guard still runs, in validators.yml.
      - security-python
    if: always()
    steps:
      # Every stage listed in `needs` must appear in the failure condition. It used
      # to print staleness-checks and portal-test while excluding both from the
      # test, so this job could announce "All CI stages passed" with either of them
      # red — the exact failure mode of a summary that reports rather than gates.
      - name: Check all stages
        run: |
          FAILED=""
          for stage in \
            "Lint:${{ needs.lint.result }}" \
            "Test:${{ needs.test.result }}" \
            "Runtime Compat:${{ needs.runtime-compat.result }}" \
            "Staleness:${{ needs.staleness-checks.result }}" \
            "Portal:${{ needs.portal-test.result }}" \
            "Storage Browser demo:${{ needs.storage-browser-demo-build.result }}" \
            "Security (CFN):${{ needs.security-cfn.result }}" \
            "Security (Python):${{ needs.security-python.result }}"; do
            name="${stage%%:*}"
            result="${stage##*:}"
            echo "  ${name}: ${result}"
            if [[ "$result" == "failure" ]]; then
              FAILED="${FAILED}${name}, "
            fi
          done
          if [[ -n "$FAILED" ]]; then
            echo "❌ Failed stage(s): ${FAILED%, }"
            exit 1
          fi
          echo "✅ All CI stages passed"
