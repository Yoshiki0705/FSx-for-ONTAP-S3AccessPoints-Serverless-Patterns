name: DevSecOps Validators
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  s3ap-iam-patterns:
    name: "S3AP IAM alias+ARN pattern check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Run S3AP IAM validator
        run: python3 scripts/check_s3ap_iam_patterns.py

  portal-drift-check:
    name: "Portal doc/code drift check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      # The rule tests live with the rest of scripts/tests and run in the
      # unit-test job in test.yaml, which already installs the dev dependencies
      # they need. Running them here as well would only duplicate that.
      - name: Check portal action inventory, i18n coverage and doc claims
        run: python3 scripts/check_portal_drift.py
      # The generic dispatch endpoints pass an untyped `params` blob, so a
      # component can send parameters an action does not read and nothing objects
      # — not the compiler, not the linter. A lock button shipped that had never
      # worked once. Needs no dependencies beyond the standard library.
      - name: Check portal actions receive the parameters they require
        run: python3 scripts/check_portal_action_params.py
      # The check above compares parameter *names*. The generated types below carry
      # the values — branded identifiers, instants and durations — so that a volume
      # name cannot be passed where a UUID belongs. This verifies the generated file
      # still describes the handlers it was generated from.
      # A translation exists but nothing links to it, or a relative link resolves
      # to nothing. Both had shipped: 27 of 83 pairs carried no language switcher,
      # and 18 links in the portal docs were dead because ../../docs/ from there is
      # solutions/docs/. GitHub renders a dead relative link as plain text, so
      # reading the page does not reveal it.
      - name: Check translated doc pairs are navigable and their links resolve
        run: python3 scripts/check_doc_pairs.py
      - name: Check the generated dispatch parameter types match the handlers
        run: python3 scripts/portal_action_types.py --check
      # AGENTS.md is loaded on every agent turn and cannot be made conditional, so
      # it had grown to 78 KB carrying notes relevant only to one kind of work.
      # Those notes now live in docs/agent/, and this keeps AGENTS.md from absorbing
      # them again and its pointers from going stale. `.kiro/` is not published, so
      # the loader checks skip here; the size and pointer checks still apply.
      - name: Check the agent context budget and that its pointers resolve
        run: python3 scripts/check_agent_context_budget.py

  handler-name-check:
    name: "Handler undefined-name sweep"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install pyflakes
        run: pip install pyflakes
      - name: Check handler undefined names
        run: python3 scripts/check_handler_names.py

  conditional-refs-check:
    name: "UC9-class conditional resource ref check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Check conditional refs
        run: python3 scripts/check_conditional_refs.py

  python-quality:
    name: "Pyflakes quality sweep (CRITICAL only)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install pyflakes
        run: pip install pyflakes
      - name: Run quality check
        run: python3 scripts/check_python_quality.py

  sensitive-leak-check:
    name: "Screenshot OCR sensitive-leak scan"
    runs-on: ubuntu-latest
    # The full leak scanner requires _sensitive_strings.py (gitignored).
    # On CI we use a CI-oriented mode that sources literals from a
    # repository secret so PR authors can't exfiltrate the sensitive list.
    # Skipped on PRs from forks because secrets are unavailable there.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install tesseract + Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-jpn
          pip install pillow pytesseract
      - name: Materialise sensitive strings from secret
        env:
          SENSITIVE_STRINGS_PY: ${{ secrets.SENSITIVE_STRINGS_PY }}
        run: |
          if [ -z "$SENSITIVE_STRINGS_PY" ]; then
            echo "SENSITIVE_STRINGS_PY secret not configured — using example (no-op) file."
            cp scripts/_sensitive_strings.py.example scripts/_sensitive_strings.py
          else
            printf '%s' "$SENSITIVE_STRINGS_PY" > scripts/_sensitive_strings.py
          fi
      - name: Run sensitive-leak scan
        run: python3 scripts/_check_sensitive_leaks.py

  cfn-guard-security:
    name: "cfn-guard IAM security rules"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cfn-guard
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/aws-cloudformation/cloudformation-guard/main/install-guard.sh | sh
          echo "$HOME/.guard/bin" >> $GITHUB_PATH
      - name: Run cfn-guard validation
        run: |
          cfn-guard validate \
            --rules security/cfn-guard-rules/ \
            --data solutions/**/template-deploy.yaml \
            --show-summary fail || true

  deprecated-models-check:
    name: "Bedrock model EOL guardrail"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Check for deprecated/EOL Bedrock model IDs
        run: python3 scripts/check_deprecated_models.py

  bedrock-inference-profile-check:
    name: "Bedrock inference-profile guard"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Self-test the guard
        run: python3 scripts/check_bedrock_inference_profile.py --selftest
      - name: Check Bedrock inference-profile compliance
        run: python3 scripts/check_bedrock_inference_profile.py

  actions-pinning-check:
    name: "Actions SHA pinning check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Check Actions are SHA-pinned and every workflow is in a directory GitHub reads
        run: python3 scripts/check_actions_pinning.py

  dependency-audit:
    name: "Dependency vulnerability audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install "$(grep -m1 '^pip-audit==' requirements-dev.txt)"
      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt --desc

  validators-summary:
    name: "Validators Summary"
    runs-on: ubuntu-latest
    needs:
      - s3ap-iam-patterns
      - portal-drift-check
      - handler-name-check
      - conditional-refs-check
      - python-quality
      - sensitive-leak-check
      - cfn-guard-security
      - deprecated-models-check
      - bedrock-inference-profile-check
      - actions-pinning-check
      - dependency-audit
    if: always()
    steps:
      - name: Evaluate
        run: |
          # Every job listed in `needs` must appear here. This step runs with
          # `if: always()`, so a dependency failing does not stop it — only a
          # missing entry does, silently. cfn-guard-security was in `needs` and
          # absent from this map, so its failures were never counted.
          declare -A results=(
            ["s3ap-iam-patterns"]="${{ needs.s3ap-iam-patterns.result }}"
            ["portal-drift-check"]="${{ needs.portal-drift-check.result }}"
            ["handler-name-check"]="${{ needs.handler-name-check.result }}"
            ["conditional-refs-check"]="${{ needs.conditional-refs-check.result }}"
            ["python-quality"]="${{ needs.python-quality.result }}"
            ["sensitive-leak-check"]="${{ needs.sensitive-leak-check.result }}"
            ["cfn-guard-security"]="${{ needs.cfn-guard-security.result }}"
            ["deprecated-models-check"]="${{ needs.deprecated-models-check.result }}"
            ["bedrock-inference-profile-check"]="${{ needs.bedrock-inference-profile-check.result }}"
            ["actions-pinning-check"]="${{ needs.actions-pinning-check.result }}"
            ["dependency-audit"]="${{ needs.dependency-audit.result }}"
          )
          failed=0
          for name in "${!results[@]}"; do
            status="${results[$name]}"
            printf '  %-28s %s\n' "$name" "$status"
            if [ "$status" = "failure" ]; then failed=$((failed+1)); fi
          done
          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed Phase 8 validator(s) failed"
            exit 1
          fi
          echo "✅ All Phase 8 validators passed"
