name: DevSecOps Validators
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  s3ap-iam-patterns:
    name: "S3AP IAM alias+ARN pattern check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Run S3AP IAM validator
        run: python3 scripts/check_s3ap_iam_patterns.py

  portal-drift-check:
    name: "Portal doc/code drift check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      # The rule tests live with the rest of scripts/tests and run in the
      # unit-test job in test.yaml, which already installs the dev dependencies
      # they need. Running them here as well would only duplicate that.
      - name: Check portal action inventory, i18n coverage and doc claims
        run: python3 scripts/check_portal_drift.py
      # The generic dispatch endpoints pass an untyped `params` blob, so a
      # component can send parameters an action does not read and nothing objects
      # — not the compiler, not the linter. A lock button shipped that had never
      # worked once. Needs no dependencies beyond the standard library.
      - name: Check portal actions receive the parameters they require
        run: python3 scripts/check_portal_action_params.py
      # A test that imports its application module by a name another function directory
      # also provides. Whichever is imported first wins `sys.modules` and the rest
      # receive it, so per-directory runs pass and the whole tree in one invocation does
      # not — 375 failures and 58 errors, plus one test that reached real AWS because it
      # patched the wrong module. Standard library only.
      - name: Check tests do not share an application module name
        run: python3 scripts/check_test_module_names.py
      # The check above compares parameter *names*. The generated types below carry
      # the values — branded identifiers, instants and durations — so that a volume
      # name cannot be passed where a UUID belongs. This verifies the generated file
      # still describes the handlers it was generated from.
      # A translation exists but nothing links to it, or a relative link resolves
      # to nothing. Both had shipped: 27 of 83 pairs carried no language switcher,
      # and 18 links in the portal docs were dead because ../../docs/ from there is
      # solutions/docs/. GitHub renders a dead relative link as plain text, so
      # reading the page does not reveal it.
      - name: Check translated doc pairs are navigable and their links resolve
        run: python3 scripts/check_doc_pairs.py
      # The check above asks whether the translations that exist are reachable.
      # docs/i18n-manifest.toml declares which ones must exist, which is the thing
      # nothing checked: every i18n check derived groups from the filesystem, so an
      # absent translation was not a finding. Ratcheted (1 missing, 271 structural as
      # measured 2026-08-15) because the six non-English locales drifted together
      # while nothing in CI looked at any locale but English.
      - name: Check declared translations exist and match the source structure
        run: python3 scripts/check_i18n_parity.py --quiet
      # The switcher is generated; hand maintenance across 1,361 files produced 12
      # label formats and left 53 group members unreachable from their own language.
      - name: Check the language switchers match the generated form
        run: python3 scripts/sync_lang_switcher.py --check
      - name: Check the generated dispatch parameter types match the handlers
        run: python3 scripts/portal_action_types.py --check
      # The two checks above describe the shape of a call. This one describes who the
      # call may name: eight endpoints took a client-supplied object key while
      # consulting neither the caller's access point nor the caller's prefixes, so
      # they returned the right answer about the wrong file. Two had already been
      # handed the group mapping and never read it, which is why reviewing the CDK
      # would not have found it. Also checks that the resolver forwards the groups,
      # because a boundary whose input is missing resolves to unrestricted.
      - name: Check every endpoint taking an object key applies the path boundary
        run: python3 scripts/check_portal_key_boundary.py
      # The AI endpoints and share links are withheld from callers outside the
      # organisation, and both are enforced in the handler rather than in AppSync. The
      # endpoints are found by what they do -- which AWS client they build, whether the
      # caller chooses the URL lifetime -- so one added later is in scope without
      # anybody remembering. Also checks the groups are forwarded: with none arriving,
      # every caller reads as internal and the restriction silently does not exist.
      - name: Check restrictions on external callers are reachable
        run: python3 scripts/check_portal_external_policy.py
      # Renovate manages pyproject.toml and requirements.txt as separate managers.
      # It raised boto3 in one and not the other, and nothing failed: the tests run
      # against requirements.txt while the package metadata claimed the other
      # version.
      - name: Check runtime pins agree between pyproject.toml and requirements.txt
        run: python3 scripts/check_runtime_pins_agree.py
      # Not the check above, despite the name: that one compares dependency pins.
      # This one is the Lambda runtime version, which `PY_VERSION` in the Makefile
      # claimed to be the single source of while it was repeated in 350 tracked
      # places -- 325 template lines, 24 CDK tokens, one CDK assertion test -- with
      # nothing comparing them. Bumping PY_VERSION alone changes the test
      # interpreter and nothing deployed; bumping part of the tree deploys two
      # runtimes, and the templates are independent stacks that nothing puts side by
      # side.
      - name: Check every Lambda runtime declaration agrees with PY_VERSION
        run: python3 scripts/check_lambda_runtime_agrees.py
      # AGENTS.md is loaded on every agent turn and cannot be made conditional, so
      # it had grown to 78 KB carrying notes relevant only to one kind of work.
      # Those notes now live in docs/agent/, and this keeps AGENTS.md from absorbing
      # them again and its pointers from going stale. `.kiro/` is not published, so
      # the loader checks skip here; the size and pointer checks still apply.
      - name: Check the agent context budget and that its pointers resolve
        run: python3 scripts/check_agent_context_budget.py
      # A pinned tool is only pinned if it is the one that runs. Measured on a
      # contributor machine: homebrew ruff 0.15.20 and cfn-lint 1.52.1 came first
      # on PATH against pins of 0.15.17 and 1.53.3, so `make lint` applied a
      # different rule set than this pipeline and reported success either way.
      # Here the runner installs the pins directly, so this confirms the runner is
      # on them rather than auditing a .venv it does not have.
      - name: Install pinned dev tooling
        run: pip install -r requirements-dev.txt
      - name: Check the resolved tool versions are the pinned ones
        run: python3 scripts/check_tool_versions.py
      # The four checks below were in `make drift` and in no workflow, so they ran
      # only for whoever typed the command and a pull request could merge past all
      # of them. Found by scripts/tests/test_gates_run_in_ci.py, which now asserts
      # that the two lists agree. All four passed on the tree when they were added,
      # so this wires up existing coverage rather than introducing new failures.
      #
      # Japanese left in an English document: the file renders, its links resolve,
      # and only a reader who cannot read Japanese is affected. 96 lines were sitting
      # in 37 files.
      - name: Check English docs contain no untranslated Japanese
        run: python3 scripts/check_en_doc_language.py
      # A template passing an environment variable under a name its handler does not
      # read. nonprofit-grant-management sent GRANT_PREFIX while the handler read
      # GRANT_APPLICATION_PREFIX with a default, so the operator's parameter was
      # discarded silently and the run discovered nothing.
      - name: Check pattern templates and handlers agree on env var names
        run: python3 scripts/check_pattern_env_contract.py
      # The demo guides tell the operator to copy samconfig.toml.example and deploy,
      # so a defect in the example is a defect in the documented path. 17 examples
      # shipped an empty S3AccessPointName, which drops the accesspoint-form ARNs
      # from the IAM policy: the stack deploys clean and then denies every access.
      - name: Check samconfig examples match their templates
        run: python3 scripts/check_samconfig_contract.py
      # The OPS handlers import shared/ lazily, so a package missing shared/ raises
      # ImportError only in Lambda at first call. Five of six patterns shipped with
      # no staging step and every test was green.
      - name: Check operations patterns stage shared/ into their package
        run: bash scripts/check_ops_shared_staged.sh
      # The irreversible-operations guard blocks SnapLock, S3 Object Lock and
      # snapshot-locking operations before they run. It must be a tracked file:
      # `.kiro/` is gitignored, so a guard living only there does not exist here or
      # for a collaborator, and a hook pointing at $HOME protects one machine
      # silently. Running the corpus in CI is what keeps the guard from being
      # narrowed by an edit nobody executes. `.kiro/` is absent on the runner, so
      # the hook-wiring assertion skips here and runs locally.
      - name: Check the irreversible-operations guard blocks, asks and allows correctly
        run: python3 scripts/guard_irreversible_ops.py --selftest
      # Obligations that come due on a date rather than on a code change. A SnapLock
      # audit log volume carries a 6-month minimum retention that blocks deletion of
      # the volume, its SVM and the file system, and AWS confirmed there is no
      # early-deletion route. That was recorded in a document, and a paragraph does
      # not fire on 2027-02-06. This does, with a lead time, so the deadline arrives
      # while there is still time to act on it.
      - name: Check no dated obligation has come due
        run: python3 scripts/check_dated_obligations.py
      # A claim that a vendor cannot do something, used as a design premise, with
      # nobody having asked the vendor. It has to run here and not only locally: the
      # failure being closed ends with the claim published to a public repository,
      # and the local pre-commit hook lives in `.kiro/`, which is gitignored and so
      # protects one machine. Its own tests run first, because a checker that reports
      # success without evaluating its rules is the same shape as the problem.
      - name: Check evidence for claims of vendor absence
        run: |
          python3 -m pytest scripts/tests/test_check_evidence_claims.py \
            scripts/tests/test_aws_support_inquiry.py --tb=short -q
          python3 scripts/check_evidence_claims.py
      # A diagram label is displayed at the size it has after the image is scaled
      # into the reader's column, so a wide canvas makes a compliant-looking
      # fontSize unreadable. The selftest runs first for the same reason as above.
      - name: Check diagram label size
        run: |
          python3 scripts/check_diagram_fonts.py --selftest
          python3 scripts/check_diagram_fonts.py

  handler-name-check:
    name: "Handler undefined-name sweep"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install pyflakes
        run: pip install pyflakes
      - name: Check handler undefined names
        run: python3 scripts/check_handler_names.py

  conditional-refs-check:
    name: "UC9-class conditional resource ref check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Check conditional refs
        run: python3 scripts/check_conditional_refs.py

  python-quality:
    name: "Pyflakes quality sweep (CRITICAL only)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install pyflakes
        run: pip install pyflakes
      - name: Run quality check
        run: python3 scripts/check_python_quality.py

  sensitive-leak-check:
    name: "Screenshot OCR sensitive-leak scan"
    runs-on: ubuntu-latest
    # The full leak scanner requires _sensitive_strings.py (gitignored).
    # On CI we use a CI-oriented mode that sources literals from a
    # repository secret so PR authors can't exfiltrate the sensitive list.
    # Skipped on PRs from forks because secrets are unavailable there.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install tesseract + Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-jpn
          pip install pillow pytesseract
      # BLOCKING when the list is unavailable. Measured 2026-08-17: this job had never
      # compared an image against a single string. The secret was never configured, so
      # the step below fell back to _sensitive_strings.py.example, whose
      # SENSITIVE_STRINGS is an empty tuple. The scanner dutifully reported
      # "No leaks detected" for 460 images and exited 0, and the check had been green
      # since 2026-05-13 on that basis -- including on 2026-06-06, when three
      # screenshots carrying a real AWS account id were committed. They stayed in the
      # public repository for ten weeks behind a green check.
      #
      # A substitute that cannot fail is worse than no check: it produces the evidence
      # of safety without the safety. If the list is missing the job now fails, because
      # "we could not look" must not render as "we looked and it was fine".
      - name: Materialise sensitive strings from secret
        env:
          SENSITIVE_STRINGS_PY: ${{ secrets.SENSITIVE_STRINGS_PY }}
        run: |
          if [ -z "$SENSITIVE_STRINGS_PY" ]; then
            echo "::error::SENSITIVE_STRINGS_PY secret is not configured, so this job cannot verify anything. Set it with: gh secret set SENSITIVE_STRINGS_PY < scripts/_sensitive_strings.py"
            exit 1
          fi
          printf '%s' "$SENSITIVE_STRINGS_PY" > scripts/_sensitive_strings.py
      - name: Run sensitive-leak scan
        run: python3 scripts/_check_sensitive_leaks.py

  cfn-guard-security:
    name: "cfn-guard IAM security rules"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cfn-guard
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/aws-cloudformation/cloudformation-guard/main/install-guard.sh | sh
          echo "$HOME/.guard/bin" >> $GITHUB_PATH
      # BLOCKING. Measured 2026-08-15: this job had never validated a template.
      # Three faults stacked, and `|| true` hid all three.
      #
      #   1. `solutions/**/template-deploy.yaml` is not expanded by the default
      #      Actions shell — `**` needs `shopt -s globstar`, which is off. The
      #      literal string reached cfn-guard, which answered "The path
      #      `solutions/**/template-deploy.yaml` does not exist" and exited 255. An
      #      earlier comment in ci.yml records the same symptom being "fixed" by
      #      removing the quotes; removing quotes does not enable globstar.
      #   2. All 7 rule files failed to PARSE under cfn-guard 3.x, using the 2.x
      #      `rule ... when %INPUT` form. A rule that does not parse enforces nothing.
      #   3. `|| true` turned both into a green check.
      #
      # The rules are now ported and the findings triaged: 296 non-compliant
      # resources on the first working run, 294 of them false positives from
      # comparing a CloudFormation intrinsic (a map) with a scalar. Type guards took
      # it to 2 real findings, both recorded in the script's KNOWN_FINDINGS with a
      # reason. The wrapper exists because cfn-guard has no baseline mechanism: it
      # fails on a NEW finding, and also on a baseline finding that has been fixed,
      # so the number cannot drift in either direction.
      - name: Run cfn-guard against every deployable template (blocking)
        run: python3 scripts/check_cfn_guard.py

  deprecated-models-check:
    name: "Bedrock model EOL guardrail"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Check for deprecated/EOL Bedrock model IDs
        run: python3 scripts/check_deprecated_models.py

  bedrock-inference-profile-check:
    name: "Bedrock inference-profile guard"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Self-test the guard
        run: python3 scripts/check_bedrock_inference_profile.py --selftest
      - name: Check Bedrock inference-profile compliance
        run: python3 scripts/check_bedrock_inference_profile.py

  actions-pinning-check:
    name: "Actions SHA pinning check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Check Actions are SHA-pinned and every workflow is in a directory GitHub reads
        run: python3 scripts/check_actions_pinning.py

  dependency-audit:
    name: "Dependency vulnerability audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install "$(grep -m1 '^pip-audit==' requirements-dev.txt)"
      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt --desc

  validators-summary:
    name: "Validators Summary"
    runs-on: ubuntu-latest
    needs:
      - s3ap-iam-patterns
      - portal-drift-check
      - handler-name-check
      - conditional-refs-check
      - python-quality
      - sensitive-leak-check
      - cfn-guard-security
      - deprecated-models-check
      - bedrock-inference-profile-check
      - actions-pinning-check
      - dependency-audit
    if: always()
    steps:
      - name: Evaluate
        run: |
          # Every job listed in `needs` must appear here. This step runs with
          # `if: always()`, so a dependency failing does not stop it — only a
          # missing entry does, silently. cfn-guard-security was in `needs` and
          # absent from this map, so its failures were never counted.
          declare -A results=(
            ["s3ap-iam-patterns"]="${{ needs.s3ap-iam-patterns.result }}"
            ["portal-drift-check"]="${{ needs.portal-drift-check.result }}"
            ["handler-name-check"]="${{ needs.handler-name-check.result }}"
            ["conditional-refs-check"]="${{ needs.conditional-refs-check.result }}"
            ["python-quality"]="${{ needs.python-quality.result }}"
            ["sensitive-leak-check"]="${{ needs.sensitive-leak-check.result }}"
            ["cfn-guard-security"]="${{ needs.cfn-guard-security.result }}"
            ["deprecated-models-check"]="${{ needs.deprecated-models-check.result }}"
            ["bedrock-inference-profile-check"]="${{ needs.bedrock-inference-profile-check.result }}"
            ["actions-pinning-check"]="${{ needs.actions-pinning-check.result }}"
            ["dependency-audit"]="${{ needs.dependency-audit.result }}"
          )
          failed=0
          for name in "${!results[@]}"; do
            status="${results[$name]}"
            printf '  %-28s %s\n' "$name" "$status"
            if [ "$status" = "failure" ]; then failed=$((failed+1)); fi
          done
          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed Phase 8 validator(s) failed"
            exit 1
          fi
          echo "✅ All Phase 8 validators passed"
