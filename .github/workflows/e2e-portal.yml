name: Portal E2E Tests

on:
  workflow_dispatch:
    inputs:
      portal_url:
        description: "Deployed portal URL (e.g., https://main.d1234.amplifyapp.com)"
        required: true
        type: string
  schedule:
    - cron: "0 9 * * 0"  # Weekly Sunday 09:00 UTC

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solutions/amplify-portal
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: solutions/amplify-portal/package-lock.json

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Run E2E smoke tests
        run: npx playwright test
        env:
          PORTAL_URL: ${{ inputs.portal_url || 'http://localhost:5173' }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: solutions/amplify-portal/playwright-report/
