# Portal E2E: a browser against a deployed portal.
#
# Dispatch-only, deliberately. There was a weekly schedule, and it could not have
# worked: with no `portal_url` input the run fell back to `http://localhost:5173`,
# `playwright.config.ts` disables its `webServer` whenever `CI` is set, and so nothing
# served the app. It also never installed the test runner -- `@playwright/test` was not
# a dependency and `npx playwright install` provisions browsers, not the runner -- so
# every Sunday for weeks the job failed while loading the config, before reaching a
# single assertion.
#
# A schedule could return once there is a long-lived deployment to point at and
# credentials for it. Until then it would either fail for want of a target or pass with
# everything skipped, and a green run that checked nothing is the worse of the two.
name: Portal E2E Tests

on:
  workflow_dispatch:
    inputs:
      portal_url:
        description: "Deployed portal URL (e.g., https://main.d1234.amplifyapp.com)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solutions/amplify-portal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: solutions/amplify-portal/package-lock.json

      - run: npm ci

      # The browsers. `@playwright/test` itself comes from `npm ci` above, pinned to an
      # exact version so the runner and the browser build cannot disagree.
      - run: npx playwright install --with-deps chromium

      # Both specs sign in and skip when PORTAL_USER / PORTAL_PASSWORD are absent, so a
      # run without the secrets reports "not checked" rather than failing on a login
      # screen it was never given a way past. Read the skip count: all-skipped means
      # this job proved nothing.
      - name: Run E2E tests
        run: npx playwright test
        env:
          PORTAL_URL: ${{ inputs.portal_url }}
          PORTAL_USER: ${{ secrets.PORTAL_USER }}
          PORTAL_PASSWORD: ${{ secrets.PORTAL_PASSWORD }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: solutions/amplify-portal/playwright-report/
