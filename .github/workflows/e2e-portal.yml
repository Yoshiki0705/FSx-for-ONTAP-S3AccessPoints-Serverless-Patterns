name: Portal E2E Tests

on:
  workflow_dispatch:
    inputs:
      portal_url:
        description: "Deployed portal URL (e.g., https://main.d1234.amplifyapp.com)"
        required: true
        type: string

jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solutions/amplify-portal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: solutions/amplify-portal/package-lock.json

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Run E2E smoke tests
        run: npx playwright test
        env:
          PORTAL_URL: ${{ inputs.portal_url }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: solutions/amplify-portal/playwright-report/
