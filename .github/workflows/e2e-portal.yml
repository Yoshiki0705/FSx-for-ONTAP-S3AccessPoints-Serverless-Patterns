name: Portal E2E Tests

on:
  workflow_dispatch:
    inputs:
      portal_url:
        description: "Deployed portal URL (e.g., https://main.d1234.amplifyapp.com)"
        required: true
        type: string
  schedule:
    - cron: "0 9 * * 0"  # Weekly Sunday 09:00 UTC

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solutions/amplify-portal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: solutions/amplify-portal/package-lock.json

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Run E2E smoke tests
        run: npx playwright test
        env:
          PORTAL_URL: ${{ inputs.portal_url || 'http://localhost:5173' }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: solutions/amplify-portal/playwright-report/
