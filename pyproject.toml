[project]
name = "fsxn-s3ap-serverless-patterns"
version = "0.19.0"
description = "FSx for ONTAP S3 Access Points Serverless Patterns — 42 industry-specific AI/ML patterns"
readme = "README.en.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Yoshiki Fujiwara"},
]
keywords = [
    "aws", "fsx-for-ontap", "s3-access-points", "serverless", "sam",
    "step-functions", "bedrock", "lambda", "flexcache", "lifekeeper",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AWS CDK",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    "boto3==1.43.63",
    "urllib3==2.7.0",
    "jsonschema==4.17.3",
]

[project.optional-dependencies]
# Dev tooling is NOT declared here. It lives in requirements-dev.txt, which the
# Makefile and every CI workflow install from. A `dev` extra used to duplicate
# that list and drifted from it (bandit was pinned here but a floating range
# there), while nothing consumed `.[dev]` — no workflow, Makefile target, or
# document referenced it.
xray = [
    "aws-xray-sdk==2.15.0",
]

[project.urls]
Repository = "https://github.com/Yoshiki0705/FSx-for-ONTAP-S3AccessPoints-Serverless-Patterns"
Documentation = "https://github.com/Yoshiki0705/FSx-for-ONTAP-S3AccessPoints-Serverless-Patterns/blob/main/README.en.md"
Issues = "https://github.com/Yoshiki0705/FSx-for-ONTAP-S3AccessPoints-Serverless-Patterns/issues"

[tool.ruff]
# Lambda deploys on python3.13, but this is the *minimum* version ruff must keep
# the source compatible with. It tracks `requires-python` (>=3.12), not the
# deployed runtime — raising it to py313 would admit 3.13-only syntax into code
# that still claims 3.12 support.
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",   # Line too long — handled by formatter
    "F841",   # Local variable assigned but never used (common in test fixtures)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F811"]  # Redefined unused fixture names
"**/conftest.py" = ["F401", "E402"]  # Unused imports + import order in conftest

[tool.ruff.format]
quote-style = "double"

# Pytest configuration lives in pytest.ini, not here. A [tool.pytest.ini_options]
# block used to duplicate it, but pytest.ini takes precedence whenever it exists,
# so that block was dead — pytest said so on every run:
#   "WARNING: ignoring pytest config in pyproject.toml!"
# Editing it had no effect, which is worse than not having it.

[tool.bandit]
exclude_dirs = ["tests", ".hypothesis", "__pycache__"]
skips = ["B101"]  # assert used in test code

[tool.coverage.run]
source = ["shared"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    # Live-infra / type-only modules excluded from unit coverage:
    "*/fpolicy-server/fpolicy_server.py",  # standalone TCP server (ECS Fargate); needs live infra
    "*/schemas/*",  # TypedDict/type declarations only — no runtime logic
]

[tool.coverage.report]
fail_under = 80
show_missing = true

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shared*"]
